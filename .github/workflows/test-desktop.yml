name: Desktop tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly, so the integration suite runs regularly without gating every PR.
    - cron: '17 23 * * *'

jobs:
  # Fast, deterministic, no network and no spawning. Gates every PR.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      # Scoped by trigger, so a pull request cannot seed a cache that a
      # protected-branch run later picks up through the prefix fallback.
      - uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ github.event_name == 'pull_request' && 'pr' || 'trunk' }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-${{ github.event_name == 'pull_request' && 'pr' || 'trunk' }}-

      # No postinstall from a fork PR's dependencies, same as deploy.yml.
      # This job never needed the Electron download anyway (tsc build, node-spawned tests).
      - name: install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # unit/ipc-identity-schemas.cjs imports @academy/validation's build output.
      - name: build workspace packages
        run: pnpm build:packages

      # Dependency audit, non-blocking while the baseline is still being
      # triaged. Pin the audit level once the report is clean and the job
      # flips to blocking in this same workflow.
      - name: dependency audit
        run: pnpm audit --prod --audit-level=low || true

      - name: unit tests
        run: pnpm --filter @tether-academy/desktop test:unit

  # Real DHT testnets and real sandboxed child processes: slower, and sensitive
  # to what the runner has installed (bwrap, Electron). Kept off the PR path so
  # an environment problem cannot block a merge, but run nightly so regressions
  # surface within a day rather than at release time.
  integration:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # The conformance matrix only means something against the kernel that
    # enforces it, and the two backends guarantee different things. Running one
    # OS would leave the other's column asserted by nobody.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      # Scoped by trigger, so a pull request cannot seed a cache that a
      # protected-branch run later picks up through the prefix fallback.
      - uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ github.event_name == 'pull_request' && 'pr' || 'trunk' }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-${{ github.event_name == 'pull_request' && 'pr' || 'trunk' }}-

      - name: install
        run: pnpm install --frozen-lockfile

      - name: build workspace packages
        run: pnpm build:packages

      # The Linux sandbox backend shells out to bwrap; without it the sandbox
      # tests would report unavailable rather than exercising confinement.
      - name: install bubblewrap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      # Ubuntu 24.04 runners restrict unprivileged user namespaces via AppArmor
      # by default, which is what bwrap needs to build its sandbox; bwrap's own
      # probe then reports the same "unavailable" result peer-exec gives a
      # denied request, so every sandboxed test refuses before it can run.
      - name: allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Pairing alone works fine standalone (confirmed separately), so probe
      # one step further: a real exec over the paired channel, matching what
      # every failing test actually does.
      - name: check worker-client exec
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: |
          cat > /tmp/init-probe.js <<'SCRIPT'
          const path = require('path');
          const req = (p) => require(path.join(process.cwd(), p));
          const createTestnet = req('node_modules/hyperdht/testnet.js');
          const hypercoreCrypto = req('node_modules/hypercore-crypto');
          const CLIENT_PATH = path.join(process.cwd(), 'electron/pear-end/worker-client.cjs');

          function freshClient() {
            delete require.cache[require.resolve(CLIENT_PATH)];
            return require(CLIENT_PATH);
          }

          function fakeDeviceIdentity() {
            const kp = hypercoreCrypto.keyPair();
            return {
              publicKey: kp.publicKey.toString('hex'),
              privateKey: kp.secretKey.toString('hex').slice(0, 64),
              secretKey: kp.secretKey.toString('hex'),
              createdAt: Date.now(),
              identityPublicKey: kp.publicKey.toString('hex'),
              source: 'tether-academy',
            };
          }

          function waitFor(client, eventName, timeoutMs) {
            return new Promise((resolve, reject) => {
              const timer = setTimeout(
                () => reject(new Error(`timed out waiting for ${eventName} after ${timeoutMs}ms`)),
                timeoutMs,
              );
              const off = client.on((event, payload) => {
                if (event !== eventName) return;
                clearTimeout(timer);
                off();
                resolve(payload);
              });
            });
          }

          (async () => {
            console.log('creating testnet...');
            const testnet = await createTestnet(3);

            console.log('initializing host...');
            const host = freshClient();
            await host.init({ deviceIdentity: fakeDeviceIdentity(), bootstrap: testnet.bootstrap });
            console.log('host ready');

            console.log('initializing guest...');
            const guest = freshClient();
            await guest.init({ deviceIdentity: fakeDeviceIdentity(), bootstrap: testnet.bootstrap });
            console.log('guest ready');

            const hostPaired = waitFor(host, 'peer:paired', 20_000);
            const guestPaired = waitFor(guest, 'peer:paired', 20_000);

            console.log('creating invite...');
            const invite = await host.createInvite({ autoApprove: true });
            console.log('accepting invite...');
            await guest.acceptInvite(invite.invite, {
              userData: { name: 'probe-guest' },
              code: invite.pairingCode,
            });

            console.log('waiting for peer:paired on both sides...');
            const [, guestEvent] = await Promise.all([hostPaired, guestPaired]);
            console.log('paired, discoveryKey =', guestEvent.discoveryKey);

            console.log('probing exec channel...');
            const execResult = await new Promise((resolve, reject) => {
              const timer = setTimeout(() => reject(new Error('exec probe timed out after 15000ms')), 15_000);
              const emitter = guest.exec({ peerId: guestEvent.discoveryKey, mode: 'inline', code: 'null' });
              emitter.on('exit', (info) => { clearTimeout(timer); resolve(info); });
              emitter.on('error', (err) => { clearTimeout(timer); reject(err); });
            });
            console.log('exec resolved:', JSON.stringify(execResult));

            await host.shutdownWorker();
            await guest.shutdownWorker();
            await testnet.destroy();
            process.exit(0);
          })().catch((err) => {
            console.error('init failed:', err);
            process.exit(1);
          });
          SCRIPT
          xvfb-run -a node /tmp/init-probe.js || echo "probe exit code: $?"

      - name: integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @tether-academy/desktop test:integration

      # sandbox-exec ships with macOS and needs no display server.
      - name: integration tests (macOS)
        if: runner.os == 'macOS'
        run: pnpm --filter @tether-academy/desktop test:integration

      # A crashed sandboxed run leaves its bwrap child execve'd into the bare
      # runtime, not a pear-end worker; run-tests.mjs reaps these between files.
      - name: report orphaned workers
        if: always()
        run: pgrep -a -x bare || echo 'no orphaned workers'

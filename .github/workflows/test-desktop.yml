name: Desktop tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly, so the integration suite runs regularly without gating every PR.
    - cron: '17 23 * * *'

jobs:
  # Fast, deterministic, no network and no spawning. Gates every PR.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      # Scoped by trigger, so a pull request cannot seed a cache that a
      # protected-branch run later picks up through the prefix fallback.
      - uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ github.event_name == 'pull_request' && 'pr' || 'trunk' }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-${{ github.event_name == 'pull_request' && 'pr' || 'trunk' }}-

      # No postinstall from a fork PR's dependencies, same as deploy.yml.
      # This job never needed the Electron download anyway (tsc build, node-spawned tests).
      - name: install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # unit/ipc-identity-schemas.cjs imports @academy/validation's build output.
      - name: build workspace packages
        run: pnpm build:packages

      # Dependency audit, non-blocking while the baseline is still being
      # triaged. Pin the audit level once the report is clean and the job
      # flips to blocking in this same workflow.
      - name: dependency audit
        run: pnpm audit --prod --audit-level=low || true

      - name: unit tests
        run: pnpm --filter @tether-academy/desktop test:unit

  # Real DHT testnets and real sandboxed child processes: slower, and sensitive
  # to what the runner has installed (bwrap, Electron). Kept off the PR path so
  # an environment problem cannot block a merge, but run nightly so regressions
  # surface within a day rather than at release time.
  integration:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # The conformance matrix only means something against the kernel that
    # enforces it, and the two backends guarantee different things. Running one
    # OS would leave the other's column asserted by nobody.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      # Scoped by trigger, so a pull request cannot seed a cache that a
      # protected-branch run later picks up through the prefix fallback.
      - uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ github.event_name == 'pull_request' && 'pr' || 'trunk' }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-${{ github.event_name == 'pull_request' && 'pr' || 'trunk' }}-

      - name: install
        run: pnpm install --frozen-lockfile

      - name: build workspace packages
        run: pnpm build:packages

      # The Linux sandbox backend shells out to bwrap; without it the sandbox
      # tests would report unavailable rather than exercising confinement.
      - name: install bubblewrap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      # Ubuntu 24.04 runners restrict unprivileged user namespaces via AppArmor
      # by default, which is what bwrap needs to build its sandbox; bwrap's own
      # probe then reports the same "unavailable" result peer-exec gives a
      # denied request, so every sandboxed test refuses before it can run.
      - name: allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The Bare-worker path is fixed (confirmed separately). sandbox-spawn.cjs
      # spawns a real Node child under bwrap+seccomp directly via wrapSpawn,
      # not a worker, and dies in under 50ms with zero stdout — reproduce
      # that exact call with full stderr/signal visibility.
      - name: check wrapSpawn node child
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: |
          cat > /tmp/spawn-probe.js <<'SCRIPT'
          const { spawn } = require('child_process');
          const path = require('path');
          const { wrapSpawn } = require(path.join(process.cwd(), 'workers/sandbox/index.cjs'));
          const { CAPABILITIES } = require(path.join(process.cwd(), 'workers/sandbox/capabilities.cjs'));

          const code = 'try { require("node:fs").readFileSync("/etc/shadow", "utf8"); ' +
            'process.stdout.write("leaked\\n"); } catch (e) { process.stdout.write("blocked: " + e.code + "\\n"); } ' +
            'process.exit(0);';

          const wrap = wrapSpawn(process.execPath, ['-e', code], { cwd: process.cwd(), grants: [] }, CAPABILITIES.qvac);
          console.log('wrap.mode:', wrap.mode, 'sandboxed:', wrap.sandboxed);
          console.log('command:', wrap.command);
          console.log('args:', JSON.stringify(wrap.args));
          console.log('warnings:', JSON.stringify(wrap.warnings));

          const child = spawn(wrap.command, wrap.args, {
            stdio: ['ignore', 'pipe', 'pipe'],
            env: { ...process.env, ...wrap.env },
            cwd: process.cwd(),
          });
          let out = '';
          let err = '';
          child.stdout.on('data', (d) => (out += d));
          child.stderr.on('data', (d) => (err += d));
          child.on('exit', (code_, signal) => {
            console.log('child exit code:', code_, 'signal:', signal);
            console.log('child stdout:', JSON.stringify(out));
            console.log('child stderr:', JSON.stringify(err));
          });
          SCRIPT
          xvfb-run -a node /tmp/spawn-probe.js || echo "probe exit code: $?"

      - name: integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @tether-academy/desktop test:integration

      # sandbox-exec ships with macOS and needs no display server.
      - name: integration tests (macOS)
        if: runner.os == 'macOS'
        run: pnpm --filter @tether-academy/desktop test:integration

      # A crashed sandboxed run leaves its bwrap child execve'd into the bare
      # runtime, not a pear-end worker; run-tests.mjs reaps these between files.
      - name: report orphaned workers
        if: always()
        run: pgrep -a -x bare || echo 'no orphaned workers'

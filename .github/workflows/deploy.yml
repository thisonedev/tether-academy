name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      # Scoped by trigger, so a pull request cannot seed a cache that a
      # protected-branch run later picks up through the prefix fallback.
      - name: cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ github.event_name == 'pull_request' && 'pr' || 'trunk' }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ github.event_name == 'pull_request' && 'pr' || 'trunk' }}-

      # This job runs on fork PRs, so the lockfile it installs from is the PR's.
      # A dependency postinstall would execute on the runner before anyone has
      # read the diff. The build does not need one: esbuild resolves its binary
      # from the platform package through its JS API, and sharp goes unused
      # because next.config.mjs sets images.unoptimized.
      - name: install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: lint
        run: pnpm --filter @tether-academy/web lint

      - name: build
        env:
          NODE_ENV: production
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./apps/web/out

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.repository == 'thisonedev/tether-academy'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
